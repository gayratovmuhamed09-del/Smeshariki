<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#4c3a99"/><stop offset="1" stop-color="#17133a"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".5" stop-color="#ffc83d"/><stop offset="1" stop-color="#d48a1a"/></linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- лучи -->
  <g transform="translate(200 150)" opacity=".25" fill="#ffd36b">
    <g><path d="M0 0 L-12 -140 L12 -140 Z"/><path d="M0 0 L-12 -140 L12 -140 Z" transform="rotate(45)"/><path d="M0 0 L-12 -140 L12 -140 Z" transform="rotate(90)"/><path d="M0 0 L-12 -140 L12 -140 Z" transform="rotate(135)"/><path d="M0 0 L-12 -140 L12 -140 Z" transform="rotate(180)"/><path d="M0 0 L-12 -140 L12 -140 Z" transform="rotate(225)"/><path d="M0 0 L-12 -140 L12 -140 Z" transform="rotate(270)"/><path d="M0 0 L-12 -140 L12 -140 Z" transform="rotate(315)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/></g>
  </g>
  <!-- лента -->
  <path d="M170 20 L200 100 L230 20 Z" fill="#ff5e62"/>
  <path d="M185 20 L200 60 L215 20 Z" fill="#ff8a8d"/>
  <!-- медаль -->
  <g>
    <circle cx="200" cy="150" r="58" fill="url(#gold)" stroke="#b8731a" stroke-width="4"/>
    <circle cx="200" cy="150" r="44" fill="none" stroke="#fff3c4" stroke-width="2" opacity=".7"/>
    <path d="M168 168 L182 168 L188 154 L206 154 L212 138 L232 138" fill="none" stroke="#9a5a10" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <animateTransform attributeName="transform" type="rotate" values="-4 200 60;4 200 60;-4 200 60" dur="3s" repeatCount="indefinite"/>
  </g>
  <!-- искры -->
  <g fill="#fff">
    <circle cx="120" cy="90" r="3"><animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="110" r="3"><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="210" r="2"><animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite"/></circle>
  </g>
</svg>
