<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2b7a"/>
      <stop offset="1" stop-color="#17133a"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5e62"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1d6"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="320" rx="30" fill="url(#sky)"/>
  <circle cx="310" cy="70" r="60" fill="url(#sun)">
    <animate attributeName="r" values="55;65;55" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g fill="#fff" opacity=".8">
    <circle cx="50" cy="40" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="70" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="30" r="2"><animate attributeName="opacity" values="1;.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
  <!-- ступени плато -->
  <path d="M0 320 L0 260 L40 250 L80 250 L360 250 L400 260 L400 320 Z" fill="#4c3a99"/>
  <path d="M40 260 L70 200 L330 200 L360 260 Z" fill="url(#rock)" opacity=".75"/>
  <path d="M90 205 L120 145 L280 145 L310 205 Z" fill="url(#rock)" opacity=".9"/>
  <path d="M140 150 L165 95 L235 95 L260 150 Z" fill="url(#rock)"/>
  <rect x="70" y="198" width="260" height="5" fill="#fff1d6" opacity=".5"/>
  <rect x="120" y="143" width="160" height="5" fill="#fff1d6" opacity=".6"/>
  <rect x="165" y="93" width="70" height="5" fill="#fff1d6" opacity=".8"/>
  <!-- флаг -->
  <line x1="200" y1="95" x2="200" y2="50" stroke="#fff" stroke-width="3"/>
  <path d="M200 52 L232 60 L200 70 Z" fill="#7cf0c4">
    <animateTransform attributeName="transform" type="skewY" values="0;-6;0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <!-- шарик, прыгающий по ступеням -->
  <circle r="9" fill="#7cf0c4">
    <animateMotion dur="5s" repeatCount="indefinite"
      path="M50 240 L100 240 Q110 180 130 190 L180 190 Q190 130 200 135 L230 135 Q235 80 200 84 L200 84 L50 240"/>
  </circle>
</svg>
